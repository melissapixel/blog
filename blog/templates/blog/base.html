{% load blog_tags show_latest_posts static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title> <!-- сами вставляем тайтл -->
    <link href="{% static "css/blog.css" %}" rel="stylesheet">
</head>
<body>

    <div id="content">
        {% block content %}
        {% endblock %}
    </div>

    <div id="sidebar">
        <h2>My blog</h2>
        <p>
            This is my blog.
            I've written {% total_posts %} posts so far.
        </p>

        <h3>Latest posts</h3>
        {% show_latest_posts 3 %}

    </div>

</body>
</html>
